name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install ruff
        # Pinned: an unpinned ruff changes the formatter under us and fails
        # unrelated PRs. Keep in sync with the `ruff` pin in the `dev` extra of
        # pyproject.toml so local and CI formatting cannot drift.
        run: pip install ruff==0.16.2
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
